id: crud-007
name: "Retrieve after PATCH reflects the updated field value"
citation: "https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_update_fields.htm"
setup:
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers:
      Content-Type: "application/json"
    body:
      Name: "Original {{rand}}"
    save:
      accountId: "$.id"
  - method: PATCH
    path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
    headers:
      Content-Type: "application/json"
    body:
      Name: "Updated {{rand}}"
request:
  method: GET
  path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
expect:
  status: 200
  body:
    Id: "{{match:sfid}}"
    Name: "Updated {{rand}}"
teardown:
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
