id: crud-003
name: "Update Account via PATCH returns 204 No Content with empty body"
citation: "https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_update_fields.htm"
setup:
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers:
      Content-Type: "application/json"
    body:
      Name: "Update Conformance {{rand}}"
    save:
      accountId: "$.id"
request:
  method: PATCH
  path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
  headers:
    Content-Type: "application/json"
  body:
    Name: "Update Conformance {{rand}} (edited)"
expect:
  # A successful PATCH returns 204 with no response body; we assert only status.
  status: 204
teardown:
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
