id: soql-005
name: "SOQL ORDER BY Name DESC returns the alphabetically-last record first"
citation: "https://developer.salesforce.com/docs/atlas.en-us.soql_sosl.meta/soql_sosl/sforce_api_calls_soql_select_orderby.htm"
setup:
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers: { Content-Type: "application/json" }
    body: { Name: "AAA-{{rand}}", Site: "SoqlOrderD-{{rand}}" }
    save: { id1: "$.id" }
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers: { Content-Type: "application/json" }
    body: { Name: "ZZZ-{{rand}}", Site: "SoqlOrderD-{{rand}}" }
    save: { id2: "$.id" }
request:
  method: GET
  path: "/services/data/v62.0/query"
  query:
    q: "SELECT Id, Name FROM Account WHERE Site = 'SoqlOrderD-{{rand}}' ORDER BY Name DESC LIMIT 1"
expect:
  status: 200
  body:
    totalSize: 1
    records:
      - Name: "ZZZ-{{rand}}"
teardown:
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:id1}}"
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:id2}}"
