id: soql-004
name: "SOQL ORDER BY Name ASC returns the alphabetically-first record first"
citation: "https://developer.salesforce.com/docs/atlas.en-us.soql_sosl.meta/soql_sosl/sforce_api_calls_soql_select_orderby.htm"
# Two records share a Site marker; ORDER BY Name ASC + LIMIT 1 must yield the
# 'AAA' record, proving ascending order (a broken/DESC sort would return 'ZZZ').
setup:
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers: { Content-Type: "application/json" }
    body: { Name: "AAA-{{rand}}", Site: "SoqlOrder-{{rand}}" }
    save: { id1: "$.id" }
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers: { Content-Type: "application/json" }
    body: { Name: "ZZZ-{{rand}}", Site: "SoqlOrder-{{rand}}" }
    save: { id2: "$.id" }
request:
  method: GET
  path: "/services/data/v62.0/query"
  query:
    q: "SELECT Id, Name FROM Account WHERE Site = 'SoqlOrder-{{rand}}' ORDER BY Name ASC LIMIT 1"
expect:
  status: 200
  body:
    totalSize: 1
    records:
      - Name: "AAA-{{rand}}"
teardown:
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:id1}}"
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:id2}}"
