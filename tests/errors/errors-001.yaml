id: errors-001
name: "Create Account with empty body returns 400 REQUIRED_FIELD_MISSING for Name"
citation: "https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/errorcodes.htm"
request:
  method: POST
  path: "/services/data/v62.0/sobjects/Account"
  headers:
    Content-Type: "application/json"
  body: {}
expect:
  status: 400
  # SF returns a top-level ARRAY of error objects. Non-strict array comparison
  # uses contains semantics: this element must appear (extra error fields like
  # `message` are ignored).
  body:
    - errorCode: "REQUIRED_FIELD_MISSING"
      fields: ["Name"]
