id: auth-005
name: "OAuth token request missing client_secret returns 400 invalid_client"
# Verified against a real Dev Edition org (2026-07-17): an omitted client_secret
# returns the same envelope as a wrong one (cf. auth-002) —
# {"error":"invalid_client","error_description":"invalid client credentials"}.
citation: "https://help.salesforce.com/s/articleView?id=sf.remoteaccess_oauth_flow_errors.htm&type=5"
request:
  method: POST
  path: "/services/oauth2/token"
  headers:
    Content-Type: "application/x-www-form-urlencoded"
  body:
    grant_type: "client_credentials"
    client_id: "{{target:client_id}}"
    # client_secret deliberately omitted
expect:
  status: 400
  body:
    error: "invalid_client"
    error_description: "invalid client credentials"
