id: validation-003
name: "Custom validation rule fires on PATCH update to negative AnnualRevenue"
citation: "https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/errorcodes.htm"
# Validation rules run on update too, not just insert. Create valid, then PATCH
# to an invalid value and expect the rule to reject it.
requires:
  - "Account validation rule 'Annual_Revenue_Not_Negative' (org prerequisite)"
setup:
  - method: POST
    path: "/services/data/v62.0/sobjects/Account"
    headers:
      Content-Type: "application/json"
    body:
      Name: "Validation Update {{rand}}"
      AnnualRevenue: 100
    save:
      accountId: "$.id"
request:
  method: PATCH
  path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
  headers:
    Content-Type: "application/json"
  body:
    AnnualRevenue: -50
expect:
  status: 400
  body:
    - errorCode: "FIELD_CUSTOM_VALIDATION_EXCEPTION"
      message: "Annual Revenue cannot be negative"
teardown:
  - method: DELETE
    path: "/services/data/v62.0/sobjects/Account/{{saved:accountId}}"
